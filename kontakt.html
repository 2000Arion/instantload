<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | InstantLoad Test</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/_ancms/css/ext/bootstrap.min.css">
    <link rel="stylesheet" href="/_ancms/css/ext/nprogress@0.2.0.min.css"/>
    <script src="/_ancms/js/ext/nprogress@0.2.0.min.js"></script>
    <script src="/_ancms/js/019d1275-cf58-7a06-b431-ffed06876054.min.js"></script>
    <style>
        /* Loader Styles */
        .iframe-wrapper {
            position: relative;
            width: 100%;
        }

        .loader-bar {
            position: relative;
            height: 4px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            z-index: 1;
        }

        /* Loader Animation bleibt unverändert */
        .loader-bar::before {
            content: "";
            position: absolute;
            left: -40%;
            width: 40%;
            height: 100%;
            background: #0d6efd;
            animation: loading 1.2s infinite;
        }

        @keyframes loading {
            0% { left: -40%; width: 40%; }
            50% { left: 20%; width: 60%; }
            100% { left: 100%; width: 40%; }
        }

        /* Hinweistext unter dem Balken */
        .loader-text {
            position: absolute;
            top: 100%; /* direkt unter der Loader-Bar */
            left: 50%;
            transform: translateX(-50%);
            margin-top: 8px;
            color: white;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none; /* Text klickbar verhindern */
        }

        .loader-text.visible {
            opacity: 1;
        }

        .loaded .loader-bar,
        .loaded .loader-text {
            display: none;
        }

        /* Mobile styles */
        @media (max-width: 865px) {
            #form-embed {
                min-height: 662px !important;
            }
        }

        @media (max-width: 575.98px) {
            .modal {
                padding: 0.5rem !important;
            }
        
            .modal-body {
                padding: 1rem !important;
            }
        
            .modal-header {
                padding: 1rem !important;
                padding-top: 2rem !important;
            }
        }
        </style>
</head>

<body class="d-flex h-100 text-center text-bg-dark" id="body">
    <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column form-group">
        <header class="mb-auto">
            <div>
                <h3 class="float-md-start mb-0"><svg href="/home" onclick="loadHomePage(event)"
                        style="background-color: rgba(6, 63, 218, 0.552); padding: 3px; cursor: pointer;"
                        xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor"
                        class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z" />
                        <path
                            d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z" />
                    </svg></h3>
                <nav class="nav nav-masthead justify-content-center float-md-end">
                    <a href="/home" style="cursor: pointer;" class="nav-link fw-bold py-1 px-0 active"
                        onclick="loadHomePage(event)">Home&nbsp;</a>
                    <a href="/funktionen" style="cursor: pointer;" class="nav-link fw-bold py-1 px-0"
                        onclick="loadFunktionenPage(event)">Funktionen&nbsp;</a>
                    <a style="cursor: context-menu;" class="nav-link fw-bold py-1 px-0" aria-current="page"
                        onclick=""><b>Kontakt</b></a>
                </nav>
            </div>
        </header>

        <main class="px-3">
            <h1>Kontakt</h1>
            <div style="color:black;" class="modal modal-sheet position-static d-block p-4 py-md-5" tabindex="-1"
                role="dialog" id="modalSignin">
                <div class="modal-dialog" style="max-width: 738px;" role="document">
                    <div class="modal-content rounded-4 shadow">
                        <div class="modal-header p-5 pb-4 border-bottom-0">
                            <h1 class="fw-bold mb-0 fs-2 formtitle">Sende uns eine Nachricht</h1>
                        </div>

                        <div class="modal-body p-5 pt-0">
                            <div class="w-100">
                                <div class="iframe-wrapper">
                                    <div class="loader-bar"></div>
                                        <iframe 
                                            id="form-embed"
                                            src="https://forms.arion2000.xyz/forms/658ffbe6-7645-48ca-b26a-a7e85d8b9a44"
                                            style="
                                                border: none;
                                                width: 100%;
                                                min-height: 600px;
                                                display: block;
                                            ">
                                        </iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-auto text-white-50">
            <br>
            <p class="fixed-bottom" style="cursor: pointer;" onclick="a2dataRef()">a2data - <span id="year"></span></p>
        </footer>
    </div>
    <script src="/_ancms/js/ext/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>

</html>
